# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
pre-commit:
  files: git diff --cached --name-only --diff-filter=ACMR
  commands: &checks
    lint:
      priority: 1
      glob: "**/*.{ts,tsx,mts,cts,js}"
      run: npx oxlint --fix {files}
      stage_fixed: true
    md:
      priority: 1
      glob: "**/*.md"
      run: npx markdownlint-cli2 --fix {files}
      stage_fixed: true
    fmt:
      priority: 2
      glob: "**/*.{ts,tsx,mts,cts,js,json,jsonc,md,yml,yaml}"
      # oxfmt errors when every staged file is ignored; oxlint exits 0 and needs no guard
      run: npx oxfmt --no-error-on-unmatched-pattern {files}
      stage_fixed: true
    type:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts}"
      run: npx tsc -p tsconfig.json --noEmit
    quality:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts,js,json}"
      run: npx fallow --fail-on-issues --quiet
    typelint:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts}"
      run: npx oxlint --type-aware
    spelling:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts,md}"
      run: npx cspell --no-progress --no-summary --no-must-find-files {files}
    actions:
      priority: 3
      glob: ".github/workflows/*.yml"
      run: actionlint {files} && zizmor --persona=pedantic {files}
    # Project commands. The guard runs before `type` and `typelint` so its message comes first;
    # the root tsconfig.json in its glob makes it run on every check, even with no TypeScript file.
    declarations:
      priority: 2
      glob: ["**/*.{ts,tsx,mts,cts}", "*.{ts,tsx,mts,cts}", "tsconfig.json"]
      run: "node scripts/check-declarations.ts"
    type-scripts:
      priority: 3
      glob:
        [
          "scripts/*.ts",
          "scripts/**/*.ts",
          "scripts/tsconfig.json",
          "tsconfig.json",
          "package.json",
        ]
      run: "npx tsc -p scripts/tsconfig.json --noEmit"

check:
  files: git ls-files --cached --others --exclude-standard
  commands:
    <<: *checks
    mod:
      priority: 4
      glob: "{.claude-plugin,hooks,types,tests}/**"
      run: npx claude plugin validate --strict .

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    test:
      priority: 1
      run: npm test
    check:
      priority: 2
      run: npm run check

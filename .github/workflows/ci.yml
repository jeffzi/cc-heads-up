name: CI

on:
  push:
    branches: [main, fix-ci/**, plan/**, "v[0-9]*"]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .fallowrc.json
      - .gitignore
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install workflow linters
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pipx install zizmor==1.29.0
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Test
        run: npm test

      # Claude Code's API declarations are all rights reserved and stay out of the
      # repository. Without them `claude-code` does not resolve, so the two type
      # checks run only on a machine where Claude Code has loaded the mod.
      - name: Check
        if: runner.os == 'Linux'
        env:
          LEFTHOOK_EXCLUDE: type,typelint
        run: npm run check && git diff --exit-code
